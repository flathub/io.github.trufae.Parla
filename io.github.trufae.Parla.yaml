id: io.github.trufae.Parla
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: parla
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: deltachat-rpc-server
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/deltachat-rpc-server/cargo
    build-commands:
      - cargo --frozen fetch --manifest-path Cargo.toml --verbose
      - cargo --frozen build --profile release --verbose --package deltachat-rpc-server
      - install -Dm755 target/release/deltachat-rpc-server /app/bin/deltachat-rpc-server
    sources:
      - type: git
        url: https://github.com/chatmail/core.git
        tag: v2.67.0
        commit: 7808d335a558569658f703b13520b1e51a565c21
      - cargo-sources-deltachat.json
  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_DOC=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_TOOLS=OFF
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.12.1.tar.xz
        sha256: c40062022a1963c80573d48f6070792297cecd7c6bffe3aefcac0d8b9bee8913
        x-checker-data:
          type: anitya
          project-id: 10649
          url-template: https://libzip.org/download/libzip-$version.tar.xz
  - name: parla
    buildsystem: meson
    config-opts:
      - -Dwebxdc=true
    sources:
      - type: git
        url: https://github.com/trufae/parla.git
        tag: 0.10.8
        commit: bfb183c86ddc6d50f9aedce64f08b0fb30df5fc4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/trufae/parla/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          tag-query: .tag_name
          is-main-source: true
