id: io.github.trufae.Parla
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: parla
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: deltachat-rpc-server
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/deltachat-rpc-server/cargo
    build-commands:
      - cargo --frozen fetch --manifest-path Cargo.toml --verbose
      - cargo --frozen build --profile release --verbose --package deltachat-rpc-server
      - install -Dm755 target/release/deltachat-rpc-server /app/bin/deltachat-rpc-server
    sources:
      - type: git
        url: https://github.com/chatmail/core.git
        tag: v2.62.0
        commit: 49f6296bdcc02b23799d191bf85e775295ddd86a
      - cargo-sources-deltachat.json
  - name: parla
    buildsystem: meson
    config-opts:
      - -Dwebxdc=true
    sources:
      - type: git
        url: https://github.com/trufae/parla.git
        tag: 0.9.4
        commit: 12d90f00398310d3abf7fd5454182b74479a42f3
        x-checker-data:
          type: json
          url: https://api.github.com/repos/trufae/parla/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          tag-query: .tag_name
          is-main-source: true
